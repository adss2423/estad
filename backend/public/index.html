<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Audiencia</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
    <!-- Encabezado -->
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold text-dark">Panel de Control de Audiencia Digital</h2>
                <p class="text-muted">Resumen de rendimiento en redes sociales</p>
            </div>
        </div>
    </div>

    <div>
        <!-- Facebook -->
        <div class="container mt-5">
            

            <!-- Tarjetas de Resumen (Datos falsos por ahora) -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-primary fw-bold">Facebook (Seguidores)</h6>
                            <h3 class="mb-0">54,230</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-primary fw-bold">Facebook (Crecimiento)</h6>
                            <h3 class="mb-0">230</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- El lienzo para primera Gráfica -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title">Crecimiento de la semana</h5>
                            <!-- Chart.js -->
                            <canvas id="graficaFacebook"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Youtube -->
        <div class="container mt-5">

            <!-- Tarjetas de Resumen (Datos falsos por ahora) -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-primary fw-bold">YouTube (Suscriptores)</h6>
                            <h3 class="mb-0">54,230</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-primary fw-bold">YouTube (Crecimiento)</h6>
                            <h3 class="mb-0">230</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- El lienzo para primera Gráfica -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title">Crecimiento de la semana</h5>
                            <!-- Chart.js -->
                            <canvas id="graficaYoutube"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Librería de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- JavaScript para pintar la gráfica -->
    <script>
        // Obtener el lienzo donde se dibujara la gráfica
        const ctxF = document.getElementById('graficaFacebook');
        const ctxY = document.getElementById('graficaYoutube');
        let graficaActualF; // Variable para guardar la gráfica y poder actualizarla
        let graficaActualY;

        // Función asíncrona para obtener los datos del servidor
        async function cargarDatosFacebook() {
            try {
                // 1. Llamamos a nuestra propia API
                const respuesta = await fetch('/api/estadisticas/facebook');
                const datos = await respuesta.json();

                // 2. Extraemos las fechas y los valores en dos arreglos separados para Chart.js
                const etiquetasFechas = datos.map(fila => fila.fecha);
                const valoresSeguidores = datos.map(fila => fila.valor);
                // Se invierte el orden para que en el chart aparezca en orden ascendente
                etiquetasFechas.reverse();
                valoresSeguidores.reverse();

                // 3. Dibujamos la gráfica con los datos reales
                graficaActualF = new Chart(ctxF, {
                    type: 'line',
                    data: {
                        labels: etiquetasFechas, // Las fechas que vienen de MySQL
                        datasets: [{
                            label: 'Seguidores en Facebook',
                            data: valoresSeguidores, // Los números que vienen de MySQL
                            borderColor: '#0d6efd',
                            tension: 0.3,
                            fill: true,
                            backgroundColor: 'rgba(13, 110, 253, 0.1)'
                        }]
                    },
                    options: { responsive: true }
                });

            } catch (error) {
                console.error("Error cargando los datos para la gráfica:", error);
            }
        }

        async function cargarDatosYoutube() {
            try {
                // 1. Llamamos a nuestra propia API
                const respuesta = await fetch('/api/estadisticas/youtube');
                const datos = await respuesta.json();

                // 2. Extraemos las fechas y los valores en dos arreglos separados para Chart.js
                const etiquetasFechas = datos.map(fila => fila.fecha);
                const valoresSeguidores = datos.map(fila => fila.valor);
                // Se invierte el orden para que en el chart aparezca en orden ascendente
                etiquetasFechas.reverse();
                valoresSeguidores.reverse();

                // 3. Dibujamos la gráfica con los datos reales
                graficaActualY = new Chart(ctxY, {
                    type: 'line',
                    data: {
                        labels: etiquetasFechas, // Las fechas que vienen de MySQL
                        datasets: [{
                            label: 'Suscriptores en YouTube',
                            data: valoresSeguidores, // Los números que vienen de MySQL
                            borderColor: '#ed0e3d',
                            tension: 0.3,
                            fill: true,
                            backgroundColor: 'rgba(200, 110, 153, 0.1)'
                            
                        }]
                    },
                    options: { responsive: true }
                });

            } catch (error) {
                console.error("Error cargando los datos para la gráfica:", error);
            }
        }

        // Ejecutamos la función apenas cargue la página
        cargarDatosFacebook();
        cargarDatosYoutube();
    </script>
</body>
</html>
