<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | CB Televisión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="img/logo1.png" alt="Logo" style="max-width: 50px;">
            <h4 class="fw-bold mt-2">Acceso Privado</h4>
            <p class="text-muted text-sm">Panel de Audiencia Digital</p>
        </div>

        <div id="mensaje-error" class="alert alert-danger d-none text-center text-sm py-2" role="alert"></div>

        <form id="form-login">
            <div class="mb-3">
                <label class="form-label text-muted text-sm fw-semibold">Usuario</label>
                <input type="text" id="usuario" class="form-control bg-light" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted text-sm fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control bg-light" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitamos que la página se recargue
            
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            const respuesta = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const datos = await respuesta.json();

            if (datos.exito) {
                window.location.href = '/'; // si es correcto lo manda al panel
            } else {
                const errorDiv = document.getElementById('mensaje-error');
                errorDiv.innerText = datos.mensaje;
                errorDiv.classList.remove('d-none'); // mensaje de error
            }
        });
    </script>
</body>
</html>
